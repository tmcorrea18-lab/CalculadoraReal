<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assinatura — Lucro Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7FB; --card:#FFFFFF; --border:rgba(20,16,40,.09); --border-strong:rgba(20,16,40,.16);
  --text:#141024; --text-2:#5B5670; --text-3:#8F8AA3;
  --accent:#6C5CE7; --accent-2:#8B7CF6; --accent-soft:rgba(108,92,231,.11);
  --success:#0EA968; --success-soft:rgba(14,169,104,.10);
  --danger:#E5484D; --danger-soft:rgba(229,72,77,.10);
  --shadow-lg:0 30px 70px -18px rgba(76,60,150,.28);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative}
.font-display{font-family:'Manrope',sans-serif}
a{color:var(--accent);text-decoration:none;font-weight:700}
a:hover{text-decoration:underline}

.bg-field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-field::before{content:'';position:absolute;inset:-10%;
  background:radial-gradient(40% 45% at 20% 12%, rgba(108,92,231,.10), transparent 65%),
             radial-gradient(45% 50% at 90% 90%, rgba(14,169,104,.07), transparent 65%);}
.chip{position:absolute;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.72);
  border:1px solid rgba(20,16,40,.06);box-shadow:0 10px 30px -10px rgba(76,60,150,.18);
  font-family:'Manrope',sans-serif;font-weight:800;color:var(--text);opacity:.5;animation:floaty 7s ease-in-out infinite;white-space:nowrap}
.chip small{display:block;font-family:'Inter',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
.chip.c1{top:12%;left:8%;font-size:18px;color:var(--accent);animation-duration:8s}
.chip.c2{top:20%;right:9%;font-size:15px;color:#0EA968;animation-duration:6.5s;animation-delay:.4s}
.chip.c3{bottom:16%;left:10%;font-size:16px;color:#3B82F6;animation-duration:7.5s;animation-delay:1s}
.chip.c4{bottom:22%;right:7%;font-size:17px;color:var(--accent-2);animation-duration:6s;animation-delay:.2s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(-1deg)}}
@media (max-width:760px){ .chip{display:none} }

.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:24px;font-family:'Manrope',sans-serif}
.brand-mark{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#6C5CE7,#8B7CF6);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -4px rgba(108,92,231,.6)}
.step-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:99px;margin-bottom:14px}
.price-card{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-lg);padding:36px 34px;width:100%;max-width:400px;text-align:center}
.price-card h1{font-family:'Manrope',sans-serif;font-size:21px;font-weight:800;margin-bottom:6px}
.amount{font-family:'Manrope',sans-serif;font-size:46px;font-weight:900;letter-spacing:-.03em;margin:14px 0 4px;color:var(--text)}
.amount span{font-size:15px;color:var(--text-3);font-weight:700}
.price-card ul{list-style:none;text-align:left;display:flex;flex-direction:column;gap:11px;margin:22px 0}
.price-card li{font-size:13.5px;color:var(--text-2);display:flex;gap:9px;align-items:flex-start;font-weight:500}
.check{width:18px;height:18px;border-radius:50%;background:var(--success-soft);color:var(--success);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;margin-top:1px}
.error-box{background:var(--danger-soft);color:var(--danger);border-radius:11px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:16px;display:none}
.error-box.show{display:block}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:16px 18px;border-radius:13px;font-size:15px;font-weight:800;border:none;cursor:pointer;transition:transform .15s ease,filter .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#6C5CE7,#8B7CF6);color:#fff;box-shadow:0 10px 28px -8px rgba(108,92,231,.65)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 13px;border-radius:99px;margin-bottom:16px}
.status-pill.active{background:var(--success-soft);color:var(--success)}
.status-pill.inactive{background:var(--danger-soft);color:var(--danger)}
.foot-link{text-align:center;font-size:13px;color:var(--text-2);margin-top:20px}
</style>
</head>
<body>
<div class="bg-field" aria-hidden="true">
  <div class="chip c1"><small>margem</small>36,7%</div>
  <div class="chip c2"><small>lucro líquido</small>R$ 29,31</div>
  <div class="chip c3"><small>markup</small>1,58x</div>
  <div class="chip c4"><small>preço ideal</small>R$ 61,00</div>
</div>
<div class="wrap">
  <a class="brand" href="/" style="color:var(--text)"><span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 1l4 8 8 4-8 4-4 8-4-8-8-4 8-4z"/></svg></span>Lucro Real</a>
  <div class="price-card">
    <span class="step-badge" id="stepBadge">Passo 2 de 2</span>
    <div id="statusPill" class="status-pill inactive" style="display:none"></div>
    <h1>Ative sua assinatura</h1>
    <div class="amount" id="amount">R$ 49,90<span>/mês</span></div>
    <ul>
      <li><span class="check">✓</span>Calculadora completa de precificação</li>
      <li><span class="check">✓</span>Comparador de canais</li>
      <li><span class="check">✓</span>Histórico salvo na nuvem</li>
      <li><span class="check">✓</span>Simulador e diagnóstico automático</li>
    </ul>
    <div class="error-box" id="errBox"></div>
    <button class="btn btn-primary" id="btnSubscribe">Pagar e liberar acesso</button>
    <div class="foot-link"><a href="/app" id="appLink" style="display:none">Ir para a calculadora</a></div>
    <div class="foot-link"><a href="#" id="logoutLink">Sair</a></div>
  </div>
</div>
<script>
async function load(){
  const r = await fetch('/api/billing/status',{credentials:'include'});
  if(r.status===401){ location.href='/login.html'; return; }
  const data = await r.json();
  const pill = document.getElementById('statusPill');
  document.getElementById('amount').innerHTML = 'R$ '+data.planValue.toFixed(2).replace('.',',')+'<span>/mês</span>';
  if(data.status==='active'){
    pill.style.display='inline-flex'; pill.className='status-pill active'; pill.textContent='Assinatura ativa';
    document.getElementById('btnSubscribe').textContent='Assinatura ativa ✓';
    document.getElementById('btnSubscribe').disabled = true;
    document.getElementById('appLink').style.display='inline';
    document.getElementById('stepBadge').style.display='none';
  } else if(data.trialActive){
    pill.style.display='inline-flex'; pill.className='status-pill active'; pill.textContent='Em teste grátis';
    document.getElementById('appLink').style.display='inline';
  }
  if(!data.configured){
    document.getElementById('errBox').textContent = 'A cobrança automática ainda está sendo configurada. Fale com o suporte para liberar seu acesso.';
    document.getElementById('errBox').classList.add('show');
    document.getElementById('btnSubscribe').disabled = true;
  }
}
document.getElementById('btnSubscribe').addEventListener('click', async ()=>{
  const btn = document.getElementById('btnSubscribe');
  btn.disabled = true; btn.textContent = 'Redirecionando...';
  const r = await fetch('/api/billing/subscribe',{method:'POST',credentials:'include'});
  const data = await r.json().catch(()=>({}));
  if(!r.ok || !data.checkoutUrl){
    const err = document.getElementById('errBox');
    err.textContent = data.error || 'Não foi possível iniciar a cobrança.';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Pagar e liberar acesso';
    return;
  }
  location.href = data.checkoutUrl;
});
document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await fetch('/api/auth/logout',{method:'POST',credentials:'include'});
  location.href='/';
});
load();
</script>
</body>
</html>
