<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Lucro Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7FB; --card:#FFFFFF; --border:rgba(20,16,40,.09); --border-strong:rgba(20,16,40,.16);
  --text:#141024; --text-2:#5B5670; --text-3:#8F8AA3;
  --accent:#6C5CE7; --accent-2:#8B7CF6; --accent-soft:rgba(108,92,231,.11);
  --danger:#E5484D; --danger-soft:rgba(229,72,77,.10);
  --shadow-lg:0 30px 70px -18px rgba(76,60,150,.28);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative}
.font-display{font-family:'Manrope',sans-serif}
a{color:var(--accent);text-decoration:none;font-weight:700}
a:hover{text-decoration:underline}

.bg-field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-field::before{content:'';position:absolute;inset:-10%;
  background:radial-gradient(38% 45% at 15% 20%, rgba(108,92,231,.10), transparent 65%),
             radial-gradient(45% 50% at 85% 85%, rgba(139,124,246,.09), transparent 65%);}
.chip{position:absolute;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.72);
  border:1px solid rgba(20,16,40,.06);box-shadow:0 10px 30px -10px rgba(76,60,150,.18);
  font-family:'Manrope',sans-serif;font-weight:800;color:var(--text);opacity:.5;animation:floaty 7s ease-in-out infinite;white-space:nowrap}
.chip small{display:block;font-family:'Inter',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
.chip.c1{top:10%;left:8%;font-size:19px;color:var(--accent);animation-duration:8s}
.chip.c2{top:20%;right:9%;font-size:15px;color:#0EA968;animation-duration:6.5s;animation-delay:.4s}
.chip.c3{bottom:14%;left:9%;font-size:16px;color:#3B82F6;animation-duration:7.5s;animation-delay:1s}
.chip.c4{bottom:20%;right:7%;font-size:17px;color:var(--accent-2);animation-duration:6s;animation-delay:.2s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(-1deg)}}
@media (max-width:760px){ .chip{display:none} }

.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:32px;font-family:'Manrope',sans-serif}
.brand-mark{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#6C5CE7,#8B7CF6);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -4px rgba(108,92,231,.6)}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);padding:36px;width:100%;max-width:400px}
.card h1{font-family:'Manrope',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
.card .sub{color:var(--text-2);font-size:13.5px;margin-bottom:26px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:12.5px;font-weight:700;color:var(--text-2)}
.field input{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;font-size:14.5px;font-weight:600;color:var(--text);outline:none;transition:border-color .18s ease,box-shadow .18s ease}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:15px 18px;border-radius:12px;font-size:14.5px;font-weight:800;border:none;cursor:pointer;transition:transform .15s ease,filter .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#6C5CE7,#8B7CF6);color:#fff;box-shadow:0 10px 26px -8px rgba(108,92,231,.6)}
.btn-primary:hover{filter:brightness(1.06)}
.foot-link{text-align:center;font-size:13.5px;color:var(--text-2);margin-top:20px}
.error-box{background:var(--danger-soft);color:var(--danger);border-radius:11px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:16px;display:none}
.error-box.show{display:block}
</style>
</head>
<body>
<div class="bg-field" aria-hidden="true">
  <div class="chip c1"><small>lucro líquido</small>R$ 29,31</div>
  <div class="chip c2"><small>margem</small>36,7%</div>
  <div class="chip c3"><small>preço ideal</small>R$ 61,00</div>
  <div class="chip c4"><small>markup</small>1,58x</div>
</div>
<div class="wrap">
  <a class="brand" href="/" style="color:var(--text)"><span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 1l4 8 8 4-8 4-4 8-4-8-8-4 8-4z"/></svg></span>Lucro Real</a>
  <div class="card">
    <h1>Entrar</h1>
    <div class="sub">Acesse sua conta para continuar calculando.</div>
    <div class="error-box" id="errBox"></div>
    <form id="form">
      <div class="field"><label>E-mail</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label>Senha</label><input type="password" id="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
    <div class="foot-link">Ainda não tem conta? <a href="/register.html">Assinar agora</a></div>
  </div>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err = document.getElementById('errBox'); err.classList.remove('show');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,password})});
  const data = await r.json().catch(()=>({}));
  if(!r.ok){ err.textContent = data.error || 'Não foi possível entrar.'; err.classList.add('show'); return; }
  location.href = '/app';
});
</script>
</body>
</html>
